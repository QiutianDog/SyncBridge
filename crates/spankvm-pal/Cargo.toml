[package]
name = "spankvm-pal"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
spankvm-proto = { path = "../spankvm-proto" }
blake3.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
libc.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.4", features = ["wayland-data-control"] }
ashpd = { version = "0.10", default-features = false, features = ["tokio"] }
evdev = "0.12"
x11rb = { version = "0.13", features = ["xinput", "xtest"] }

