[workspace]
resolver = "2"
members = [
  "crates/spankvm-proto",
  "crates/spankvm-core",
  "crates/spankvm-pal",
  "crates/spankvm-net",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = { version = "1.5", features = ["pure"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
spake2 = "0.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
mdns-sd = "0.11"
bytes = "1.8"
arboard = "3.4"
libc = "0.2"

